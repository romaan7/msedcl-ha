name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * 1" # weekly: catch upstream hassfest/HACS rule changes
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # remove once the integration is added to home-assistant/brands
          ignore: brands
